[package]
name = "pointdom-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
dirs = "=7.0.0"
axum = "=0.8.9"
chrono = { version = "=0.4.45", features = ["serde"] }
fs2 = "=0.4.3"
hex = "=0.4.3"
jsonschema = { version = "=0.59.0", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["full"] }
tokio-util = { version = "=0.7.20", features = ["rt", "codec"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
toml_edit = "=0.25.17"
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
[lints]
workspace = true
