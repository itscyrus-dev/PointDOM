[workspace]
members = ["crates/pointdom-core", "crates/pointdom-cli", "src-tauri"]
default-members = ["crates/pointdom-core", "crates/pointdom-cli"]
resolver = "2"

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/itscyrus-dev/PointDOM"

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
