name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      documentation-only: ${{ steps.changes.outputs.documentation-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - id: changes
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-changes.ts
  documentation:
    needs: changes
    if: needs.changes.outputs.documentation-only == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: node scripts/check-doc-links.ts
  platforms:
    needs: changes
    if: needs.changes.outputs.documentation-only != 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
  verify:
    needs: [changes, documentation, platforms]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require the selected checks
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCUMENTATION_ONLY: ${{ needs.changes.outputs.documentation-only }}
          DOCUMENTATION: ${{ needs.documentation.result }}
          NATIVE: ${{ needs.platforms.result }}
        run: |
          test "$CHANGES" = success
          if [ "$DOCUMENTATION_ONLY" = true ]; then
            test "$DOCUMENTATION" = success
            test "$NATIVE" = skipped
          else
            test "$DOCUMENTATION_ONLY" = false
            test "$NATIVE" = success
            test "$DOCUMENTATION" = skipped
          fi
