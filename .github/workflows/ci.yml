name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platforms:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
  verify:
    needs: platforms
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require all platforms
        env:
          RESULT: ${{ needs.platforms.result }}
        run: test "$RESULT" = success
