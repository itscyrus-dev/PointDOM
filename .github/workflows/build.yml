name: Native builds
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release-tag:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  build:
    name: macOS ARM64
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_TEST_THREADS: '1'
      RELEASE_TAG: ${{ inputs.release-tag }}
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: native_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/**/incremental
            !target/**/bundle
          key: rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            rust-v2-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - name: Verify versions
        run: node --input-type=module -e 'import {releaseVersion} from "./scripts/release-utils.ts"; await releaseVersion(".", process.env.RELEASE_TAG || undefined)'
      - run: pnpm format:check
      - run: pnpm check
      - name: Verify generated contracts
        run: |
          pnpm native:contracts
          git diff --exit-code -- crates/pointdom-core/contracts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser and renderer integration tests
        run: |
          pnpm exec playwright test
          pnpm test:desktop
      # pnpm check already built the extension and renderer used by these tests.
      - name: Build native release binaries
        run: |
          node scripts/desktop/build.mjs
          pnpm exec tauri build --no-bundle
      - name: Package native installers
        if: inputs.release-tag != ''
        run: pnpm exec tauri bundle
      - run: pnpm release:pack
        if: inputs.release-tag != ''
      - run: pnpm release:verify
        if: inputs.release-tag != ''
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.release-tag != ''
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
      - name: Isolated UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-${{ runner.os }}-${{ runner.arch }}
          path: |
            test-results/**/desktop-*.png
            test-results/**/extension-tasks-*.png
            test-results/**/local-binding-light.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve compiled dependencies after failed checks
        if: failure() && steps.native_cache.outcome == 'success' && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/**/incremental
            !target/**/bundle
          key: rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
