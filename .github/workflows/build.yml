name: Native builds
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release-tag:
        default: ''
        type: string
permissions:
  contents: read
jobs:
  build:
    name: macOS ARM64
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_TEST_THREADS: '1'
      RELEASE_TAG: ${{ inputs.release-tag }}
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: macos-arm64
          cache-bin: false
          # PRs and tags restore the dependency cache maintained by successful main builds.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - name: Verify versions
        run: node --input-type=module -e 'import {releaseVersion} from "./scripts/release-utils.ts"; await releaseVersion(".", process.env.RELEASE_TAG || undefined)'
      - run: pnpm format:check
      - run: pnpm check
      - name: Verify generated contracts
        run: |
          pnpm native:contracts
          git diff --exit-code -- crates/pointdom-core/contracts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser and renderer integration tests
        run: |
          pnpm exec playwright test
          pnpm test:desktop
      # pnpm check already built the extension and renderer used by these tests.
      - name: Link native binaries for pull requests
        if: github.event_name == 'pull_request'
        run: |
          node scripts/desktop/build.mjs --debug
          pnpm exec tauri build --debug --no-bundle
      - name: Build native release binaries
        if: github.event_name != 'pull_request'
        run: |
          node scripts/desktop/build.mjs
          pnpm exec tauri build --no-bundle
      - name: Package native installers
        if: inputs.release-tag != ''
        env:
          # Preserve the Finder background, window size and drag-to-install layout on CI.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: pnpm exec tauri bundle
      - run: pnpm release:pack
        if: inputs.release-tag != ''
      - run: pnpm release:verify
        if: inputs.release-tag != ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release-tag != ''
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
      - name: Isolated UI screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-${{ runner.os }}-${{ runner.arch }}
          path: |
            test-results/**/desktop-*.png
            test-results/**/extension-tasks-*.png
            test-results/**/local-binding-light.png
          if-no-files-found: ignore
          retention-days: 7
