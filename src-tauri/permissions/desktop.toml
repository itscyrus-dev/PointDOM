[[permission]]
identifier = "desktop-tasks"
description = "Read task state, cancel a task, open its main window and respect reduced motion."
commands.allow = ["snapshot", "cancel_job", "open_main", "set_reduced_motion"]

[[permission]]
identifier = "desktop-admin"
description = "User-initiated setup in the main window only."
commands.allow = ["confirm_discovery", "open_project", "remove_project", "approve_extension", "retry_service", "choose_folder", "add_project", "open_extensions", "reveal_extension", "connect_codex", "mcp_configuration", "open_resource", "set_menu_bar_visibility", "set_language", "fit_main_window"]
