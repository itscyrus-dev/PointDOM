[package]
name = "pointdom-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
[dependencies]
pointdom-core = { path = "../crates/pointdom-core" }
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-single-instance = { version = "=2.5.4", features = ["deep-link"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["full"] }
url = "=2.5.8"
[lints]
workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
